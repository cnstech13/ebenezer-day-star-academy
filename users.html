<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management</title><link rel="stylesheet" href="portal-dashboard.css"><style>main{width:min(1100px,92%);margin:30px auto}.panel{background:#fff;padding:22px;border-radius:16px;margin-bottom:20px;box-shadow:0 8px 25px #123b6612}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}input,select,button{padding:11px;border:1px solid #ccd8e2;border-radius:8px}button{background:#123b66;color:#fff;border:0;cursor:pointer}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e7edf2;text-align:left}</style></head><body><header><strong>Admin • User Management</strong><nav><a href="dashboard.html">Dashboard</a><a href="users.html">Users</a><a href="fees.html">Fees</a><a href="notifications.html">Notifications</a><button id="logout">Logout</button></nav></header><main><div class=panel><h2>Create Teacher/Student Account</h2><form id=form><div class=formgrid><input id=name placeholder="Full name" required><input id=email type=email placeholder="Email" required><input id=password type=password minlength=6 placeholder="Temporary password" required><select id=role><option value=teacher>Teacher</option><option value=student>Student</option></select><input id=link placeholder="Teacher ID / Student ID"><input id=classes placeholder="Assigned class IDs (teacher, comma separated)"></div><button type=submit style="margin-top:14px">Create Account</button><p id=msg></p></form></div><div class=panel><h2>Registered Portal Users</h2><div class=table><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Linked record</th><th>Status</th></tr></thead><tbody id=rows></tbody></table></div></div></main><script type="module" src="users.js"></script></body></html>
