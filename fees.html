<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Fees Management</title>

    <link
        rel="stylesheet"
        href="portal-dashboard.css"
    >

    <style>

        main {
            width: min(1100px, 92%);
            margin: 30px auto;
        }


        .panel {
            background: #fff;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;

            /*
             * Prevent content from
             * overflowing the panel.
             */
            min-width: 0;
            overflow: hidden;
        }


        .gridform {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 10px;
        }


        input,
        select,
        button {
            padding: 11px;

            border: 1px solid #ccd8e2;

            border-radius: 8px;

            box-sizing: border-box;

            max-width: 100%;
        }


        button {
            background: #123b66;

            color: #fff;

            border: 0;

            cursor: pointer;
        }


        /* =================================================
           TABLE SCROLL CONTAINER
        ================================================= */

        .table-container {

            width: 100%;

            max-width: 100%;

            overflow-x: auto;

            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;

            border-radius: 10px;

            margin-top: 15px;
        }


        /* =================================================
           FEE TABLE
        ================================================= */

        table {

            width: 100%;

            min-width: 700px;

            border-collapse: collapse;

            margin-top: 0;

            table-layout: auto;
        }


        th,
        td {

            padding: 12px;

            border-bottom:
                1px solid #e5ebef;

            text-align: left;

            white-space: nowrap;
        }


        th {

            background: #f5f8fb;

            font-weight: 600;
        }


        tbody tr:hover {

            background: #f8fafc;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            main {

                width: 94%;

                margin:
                    20px auto;
            }


            .panel {

                padding: 16px;

                border-radius: 14px;
            }


            .panel h2 {

                font-size: 20px;
            }


            .gridform {

                grid-template-columns: 1fr;
            }


            .table-container {

                margin-top: 12px;
            }


            table {

                min-width: 700px;
            }


            th,
            td {

                padding: 10px;

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <header>

        <strong>
            Admin • Fees
        </strong>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="fees.html">
                Fees
            </a>

            <a href="users.html">
                Users
            </a>

            <a href="notifications.html">
                Notifications
            </a>

            <button id="logout">
                Logout
            </button>

        </nav>

    </header>


    <main>


        <!-- =================================================
             RECORD FEE
        ================================================= -->

        <div class="panel">

            <h2>
                Record Fee
            </h2>


            <form id="form">


                <div class="gridform">


                    <input
                        id="studentId"
                        type="text"
                        placeholder="Student ID"
                        required
                    >


                    <input
                        id="title"
                        type="text"
                        placeholder="Fee description"
                        required
                    >


                    <input
                        id="amount"
                        type="number"
                        min="0"
                        placeholder="Amount (₦)"
                        required
                    >


                    <select id="status">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Paid">
                            Paid
                        </option>

                        <option value="Partially Paid">
                            Partially Paid
                        </option>

                        <option value="Waived">
                            Waived
                        </option>

                    </select>


                    <input
                        id="session"
                        type="text"
                        placeholder="Session e.g. 2026/2027"
                    >


                    <input
                        id="term"
                        type="text"
                        placeholder="Term e.g. First Term"
                    >


                </div>


                <button
                    type="submit"
                    style="margin-top: 12px;"
                >
                    Save Fee
                </button>


                <p id="msg"></p>


            </form>

        </div>



        <!-- =================================================
             FEE RECORDS
        ================================================= -->

        <div class="panel">

            <h2>
                Fee Records
            </h2>


            <!-- TABLE SCROLL AREA -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Student
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Session
                            </th>

                        </tr>

                    </thead>


                    <tbody id="rows">

                    </tbody>

                </table>

            </div>


        </div>


    </main>



    <script
        type="module"
        src="fees.js"
    ></script>


</body>

</html>
