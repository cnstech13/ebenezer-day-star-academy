<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Fees Management</title>

    <link
        rel="stylesheet"
        href="portal-dashboard.css"
    >

    <style>

        main {
            width: min(1100px, 92%);
            margin: 30px auto;
        }

        .panel {
            background: #fff;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .gridform {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 10px;
        }

        input,
        select,
        button {
            padding: 11px;
            border: 1px solid #ccd8e2;
            border-radius: 8px;
        }

        button {
            background: #123b66;
            color: #fff;
            border: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        td,
        th {
            padding: 10px;
            border-bottom: 1px solid #e5ebef;
            text-align: left;
        }

    </style>

</head>


<body>


    <header>

        <strong>
            Admin • Fees
        </strong>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="fees.html">
                Fees
            </a>

            <a href="users.html">
                Users
            </a>

            <a href="notifications.html">
                Notifications
            </a>

            <button id="logout">
                Logout
            </button>

        </nav>

    </header>


    <main>


        <!-- RECORD FEE -->

        <div class="panel">

            <h2>
                Record Fee
            </h2>


            <form id="form">


                <div class="gridform">


                    <input
                        id="studentId"
                        placeholder="Student ID"
                        required
                    >


                    <input
                        id="title"
                        placeholder="Fee description"
                        required
                    >


                    <input
                        id="amount"
                        type="number"
                        min="0"
                        placeholder="Amount (₦)"
                        required
                    >


                    <select id="status">

                        <option>
                            Pending
                        </option>

                        <option>
                            Paid
                        </option>

                        <option>
                            Partially Paid
                        </option>

                        <option>
                            Waived
                        </option>

                    </select>


                    <input
                        id="session"
                        placeholder="Session e.g. 2026/2027"
                    >


                    <input
                        id="term"
                        placeholder="Term e.g. First Term"
                    >


                </div>


                <button
                    type="submit"
                    style="margin-top: 12px;"
                >
                    Save Fee
                </button>


                <p id="msg"></p>


            </form>

        </div>



        <!-- FEE RECORDS -->

        <div class="panel">

            <h2>
                Fee Records
            </h2>


            <table>


                <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Session
                        </th>

                    </tr>

                </thead>


                <tbody id="rows">

                </tbody>


            </table>

        </div>


    </main>



    <script
        type="module"
        src="fees.js"
    ></script>


</body>

</html>
