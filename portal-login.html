<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Portal Login | Ebenezer Day Star Academy</title><link rel="stylesheet" href="glass.css"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#75c8ff,#eaf8ff);font-family:Arial,sans-serif}.card{width:min(92%,430px);padding:32px;border-radius:24px;background:#ffffffd9;backdrop-filter:blur(14px);box-shadow:0 20px 60px #164e6333}.brand{text-align:center}.brand h1{margin:0;color:#123b66}.brand p{color:#557}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.tabs button{padding:11px;border:0;border-radius:10px;background:#e8f1f8;cursor:pointer}.tabs button.active{background:#123b66;color:white}label{display:block;margin:12px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd8e2;border-radius:10px}button[type=submit]{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#123b66;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;text-align:center}.links{text-align:center;margin-top:16px}</style></head><body><main class="card"><div class="brand"><h1>Ebenezer Day Star Academy</h1><p>Teacher & Student Portal</p></div><div class="tabs"><button data-role="teacher" class="active">Teacher</button><button data-role="student">Student</button><button data-role="parent">Parent</button></div><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">Sign In</button><div id="msg" class="msg"></div></form><div id="parentLink" class="links" style="display:none"><a href="parent-register.html">New Parent? Create an account</a></div><div class="links"><a href="admin-login.html">Administrator Login</a></div></main><script type="module" src="portal-login.js"></script></body></html>
