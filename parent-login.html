<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    
    <meta name="theme-color" content="lightblue">

    <title>Parent Login | Ebenezer Day Star Academy</title>

    <link
        rel="stylesheet"
        href="parent-login.css"
    >
    <link
        rel="stylesheet"
        href="glass.css"
    >

    <meta name="robots" content="noindex, nofollow, noarchive">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="school-logo">
                P
            </div>

            <h1>Parent Portal</h1>

            <p class="subtitle">
                Ebenezer Day Star Academy
            </p>


            <div
                id="errorMessage"
                class="message error"
            ></div>


            <div
                id="successMessage"
                class="message success"
            ></div>


            <form id="parentLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>


            <button
                type="button"
                id="forgotPassword"
                class="forgot-password"
            >
                Forgot Password?
            </button>

<p class="register-link">
    New Parent?
    <a href="parent-register.html">Create an account</a>
</p>

        </section>



    </main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
        type="module"
        src="parent-login.js"
    ></script>

</body>

</html>
