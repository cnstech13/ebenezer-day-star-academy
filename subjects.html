<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="lightblue">

    <title>Subjects | Ebenezer Day Star Academy</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin-login.css">
    <link rel="stylesheet" href="subjects.css">

    <meta
        name="robots"
        content="noindex, nofollow, noarchive"
    >

</head>

<body>

<div class="admin-layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="admin-sidebar">

        <div class="admin-brand">

            <div class="logo-icon">

                <img
                    src="badge.jpg"
                    alt="Ebenezer Day Star Academy"
                >

            </div>

            <div>

                <strong>
                    Ebenezer Day Star
                </strong>

                <small>
                    Admin Portal
                </small>

            </div>

        </div>


        <nav>

            <a href="logout.html" id="logoutBtn">
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">

        <!-- HEADER -->

        <header class="admin-header">

            <strong>
                Subject Management
            </strong>

            <span id="adminUser">
                Administrator
            </span>

        </header>


        <!-- CONTENT -->

        <section class="admin-content">

            <!-- PAGE HEADER -->

            <div class="page-header-row">

                <div class="admin-title">

                    <h1>
                        Subjects
                    </h1>

                    <p>
                        Manage subjects taught in the school.
                    </p>

                </div>


                <button
                    type="button"
                    class="btn btn-primary"
                    id="addSubjectBtn"
                >
                    + Add Subject
                </button>

            </div>


            <!-- =================================================
                 FILTER / SEARCH
            ================================================== -->

            <div class="student-toolbar">

                <!-- SEARCH -->

                <input
                    type="search"
                    id="subjectSearch"
                    placeholder="Search subjects..."
                    autocomplete="off"
                >


                <!-- LEVEL FILTER -->

                <select id="subjectLevelFilter">

                    <option value="">
                        All Levels
                    </option>

                    <option value="Nursery">
                        Nursery
                    </option>

                    <option value="Primary 1">
                        Primary 1
                    </option>

                    <option value="Primary 2">
                        Primary 2
                    </option>

                    <option value="Primary 3">
                        Primary 3
                    </option>

                    <option value="Primary 4">
                        Primary 4
                    </option>

                    <option value="JSS 1">
                        JSS 1
                    </option>

                    <option value="JSS 2">
                        JSS 2
                    </option>

                </select>


                <!-- STATUS FILTER -->

                <select id="subjectStatusFilter">

                    <option value="">
                        All Status
                    </option>

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- =================================================
                 SUBJECT TABLE
            ================================================== -->

            <div class="admin-table-container">

                <table class="admin-table">

                    <thead>

                        <tr>

                            <th>
                                Subject ID
                            </th>

                            <th>
                                Subject
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Level
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="subjectsTableBody">
                    </tbody>

                </table>


                <!-- EMPTY STATE -->

                <div
                    id="emptySubjects"
                    class="empty-state"
                >

                    <div>
                        📚
                    </div>

                    <h3>
                        No subjects found
                    </h3>

                    <p>
                        Add your first subject.
                    </p>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     SUBJECT MODAL
========================================================= -->

<div
    class="modal"
    id="subjectModal"
>

    <div class="modal-content">


        <!-- MODAL HEADER -->

        <div class="modal-header">

            <div>

                <h2 id="subjectModalTitle">
                    Add Subject
                </h2>

                <p>
                    Enter subject information.
                </p>

            </div>


            <button
                type="button"
                class="modal-close"
                id="closeSubjectModal"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- =================================================
             SUBJECT FORM
        ================================================== -->

        <form id="subjectForm">

            <!-- EDITING ID -->

            <input
                type="hidden"
                id="editingSubjectId"
            >


            <div class="form-grid">


                <!-- SUBJECT NAME -->

                <div class="form-group">

                    <label for="subjectName">
                        Subject Name *
                    </label>

                    <input
                        type="text"
                        id="subjectName"
                        placeholder="e.g. Mathematics"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- SUBJECT CODE -->

                <div class="form-group">

                    <label for="subjectCode">
                        Subject Code *
                    </label>

                    <input
                        type="text"
                        id="subjectCode"
                        placeholder="e.g. MTH"
                        maxlength="10"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- SUBJECT LEVEL -->

                <div class="form-group">

                    <label for="subjectLevel">
                        Level *
                    </label>

                    <select
                        id="subjectLevel"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select Level
                        </option>

                        <option value="Nursery">
                            Nursery
                        </option>

                        <option value="Primary 1">
                            Primary 1
                        </option>

                        <option value="Primary 2">
                            Primary 2
                        </option>

                        <option value="Primary 3">
                            Primary 3
                        </option>

                        <option value="Primary 4">
                            Primary 4
                        </option>

                        <option value="JSS 1">
                            JSS 1
                        </option>

                        <option value="JSS 2">
                            JSS 2
                        </option>

                    </select>

                </div>


                <!-- SUBJECT TYPE -->

                <div class="form-group">

                    <label for="subjectType">
                        Subject Type *
                    </label>

                    <select
                        id="subjectType"
                        required
                    >

                        <option value="Core">
                            Core
                        </option>

                        <option value="Elective">
                            Elective
                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="subjectStatus">
                        Status
                    </label>

                    <select id="subjectStatus">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div
                    class="form-group"
                    style="grid-column: 1 / -1;"
                >

                    <label for="subjectDescription">
                        Description
                    </label>

                    <textarea
                        id="subjectDescription"
                        rows="3"
                        placeholder="Optional subject description"
                    ></textarea>

                </div>

            </div>


            <!-- =================================================
                 MODAL ACTIONS
            ================================================== -->

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-outline"
                    id="cancelSubjectBtn"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Subject
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================================================
     SCRIPTS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="sweetalert.js"></script>

<script
    type="module"
    src="admin-login.js"
></script>

<script
    type="module"
    src="subjects.js"
></script>


</body>

</html>
