<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1f3a"
    >

    <title>
        Teacher Login | Ebenezer Day Star Academy
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071a33 0%,
                    #0b1f3a 50%,
                    #163f70 100%
                );

        }


        /* =====================================================
           PAGE
        ====================================================== */

        .page {

            width: 100%;

            max-width: 450px;

        }


        /* =====================================================
           SCHOOL HEADER
        ====================================================== */

        .school-header {

            text-align: center;

            color: white;

            margin-bottom: 22px;

        }


        /* =====================================================
           SCHOOL LOGO
        ====================================================== */

        .logo {

            width: 82px;

            height: 82px;

            margin: 0 auto 14px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: transparent;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.18);

        }


        .logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

        }


        .school-header h1 {

            margin: 0;

            font-size: 24px;

            line-height: 1.25;

        }


        .school-header p {

            margin: 7px 0 0;

            color: #dce6f3;

            font-size: 13px;

        }


        .motto {

            margin-top: 8px;

            color: #f4d35e;

            font-size: 12px;

            font-weight: bold;

        }


        /* =====================================================
           LOGIN CARD
        ====================================================== */

        .card {

            background: white;

            border-radius: 22px;

            padding: 28px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.25);

        }


        .title {

            text-align: center;

            margin-bottom: 23px;

        }


        .title h2 {

            margin: 0;

            color: #0b1f3a;

            font-size: 22px;

        }


        .title p {

            margin: 7px 0 0;

            color: #718096;

            font-size: 13px;

            line-height: 1.5;

        }


        /* =====================================================
           FORM
        ====================================================== */

        .form-group {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #26384f;

            font-size: 13px;

            font-weight: bold;

        }


        input {

            width: 100%;

            height: 50px;

            padding: 12px 14px;

            border:
                1px solid
                #d6dee8;

            border-radius: 11px;

            outline: none;

            background: white;

            color: #17253a;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        input:focus {

            border-color: #0b1f3a;

            box-shadow:
                0 0 0 4px
                rgba(11, 31, 58, 0.08);

        }


        /* =====================================================
           PASSWORD
        ====================================================== */

        .password-box {

            position: relative;

        }


        .password-box input {

            padding-right: 70px;

        }


        .show-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #0b1f3a;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

        }


        /* =====================================================
           LOGIN BUTTON
        ====================================================== */

        .login-btn {

            width: 100%;

            height: 50px;

            margin-top: 7px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #0b1f3a,
                    #163f70
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(11, 31, 58, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .login-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 24px
                rgba(11, 31, 58, 0.25);

        }


        .login-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           LINKS
        ====================================================== */

        .links {

            text-align: center;

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid
                #edf1f5;

            font-size: 13px;

            line-height: 2;

            color: #718096;

        }


        .links a {

            color: #0b1f3a;

            font-weight: bold;

            text-decoration: none;

        }


        .links a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .footer {

            margin-top: 18px;

            text-align: center;

            color: #c8d4e4;

            font-size: 11px;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 480px) {

            body {

                padding: 14px;

                align-items: flex-start;

                padding-top: 30px;

            }


            .logo {

                width: 70px;

                height: 70px;

                margin-bottom: 14px;

            }


            .card {

                padding: 22px 17px;

                border-radius: 18px;

            }


            .school-header h1 {

                font-size: 21px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         SCHOOL HEADER
    ====================================================== -->

    <div class="school-header">


        <!-- SCHOOL LOGO -->

        <div class="logo">

            <img
                src="school-logo.png"
                alt="Ebenezer Day Star Academy Logo"
            >

        </div>


        <h1>
            Ebenezer Day Star Academy
        </h1>


        <p>
            Teacher Portal
        </p>


        <div class="motto">
            In God We Trust
        </div>

    </div>



    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <div class="card">


        <div class="title">

            <h2>
                Teacher Login
            </h2>

            <p>
                Sign in to access your Teacher Portal.
            </p>

        </div>



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form id="teacherLoginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="teacherEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="teacherEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="teacherPassword">
                    Password
                </label>


                <div class="password-box">

                    <input
                        type="password"
                        id="teacherPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        data-target="teacherPassword"
                    >

                        Show

                    </button>

                </div>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginBtn"
                class="login-btn"
            >

                Login to Teacher Portal

            </button>


        </form>



        <!-- =================================================
             LINKS
        ================================================== -->

        <div class="links">


            <div>

                Don't have a Teacher Portal account?

                <br>

                <a href="teacher-register.html">
                    Create Teacher Account
                </a>

            </div>


            <div>

                <a href="index.html">
                    ← Back to School Website
                </a>

            </div>


        </div>


    </div>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        Ebenezer Day Star Academy

    </div>


</div>



<!-- =========================================================
     SWEETALERT2
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
></script>



<!-- =========================================================
     TEACHER LOGIN JAVASCRIPT
========================================================= -->

<script
    type="module"
    src="teacher-login.js"
></script>


</body>

</html>
